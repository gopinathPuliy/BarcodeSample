apply plugin: 'com.android.application'
apply from: '../jacoco.gradle'
android {
    compileSdkVersion 36
    buildToolsVersion "36.0.0"
    namespace 'com.honeywell.barcodeexample'

    defaultConfig {
        applicationId "com.honeywell.barcodeexample"
        minSdkVersion 27
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        aidl true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    testOptions{
        unitTests.includeAndroidResources=true
        unitTests.all {

            jvmArgs += [
                    '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                    '--add-opens=java.base/java.util=ALL-UNNAMED',
                    '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
                    '--add-opens=java.xml/com.sun.org.apache.xerces.internal.dom=ALL-UNNAMED',
                    '--add-opens=java.xml/com.sun.org.apache.xalan.internal=ALL-UNNAMED',
                    '--add-opens=java.base/jdk.internal.reflect=ALL-UNNAMED'
            ]

        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                if (variant.buildType.name.equals('release')) {
                    /*output.outputFile = new File(output.outputFile.parent,
                            "BarcodeExample" + "-release.apk")*/
                    def name = "BarcodeExample -release.apk"
                    output.outputFileName = name
                } else if (variant.buildType.name.equals('debug')) {
                    /* output.outputFile = new File(output.outputFile.parent,
                             "BarcodeExample -debug.apk")*/
                    def name = "BarcodeExample -debug.apk"
                    output.outputFileName = name
                }
            }
        }
    }
    dependencies {
        implementation project(":DataCollectionLib")
        implementation 'androidx.appcompat:appcompat:1.3.1'
        implementation 'com.google.android.material:material:1.4.0'
        implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-core:3.12.4'
        testImplementation 'org.powermock:powermock-module-junit4:2.0.9'
        testImplementation 'org.powermock:powermock-api-mockito2:2.0.9'
        testImplementation 'org.powermock:powermock-classloading-xstream:2.0.9'
        testImplementation 'androidx.test:core:1.7.0'
        testImplementation 'androidx.test.ext:junit:1.3.0'
        androidTestImplementation 'androidx.test:core:1.7.0'
        testImplementation 'com.squareup.okhttp3:mockwebserver:4.9.1'
        testImplementation 'org.mockito:mockito-inline:3.3.3'
        testImplementation 'org.robolectric:robolectric:4.16.1'
        testImplementation 'androidx.test:rules:1.4.0' // Newly added dependency
        testImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    }
}
